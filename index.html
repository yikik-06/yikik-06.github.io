<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="NA9VOvNYVXFU0m1MLMphRo66E07L4U5Q5VdaHuMUVuI" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ilgaz Digital — Ready-to-Deploy Web Templates & Micro Tools</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Tema: kayıtlı tercih yoksa sistem temasını kullan
  (function () {
    let d = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    try { const s = localStorage.getItem('ilgazTheme'); if (s) d = s === 'dark'; } catch (e) {}
    document.documentElement.classList.toggle('dark', d);
  })();
</script>
<style>
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.card{transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-6px)}
.buy-btn{background:linear-gradient(135deg,#7c3aed,#4f46e5,#2563eb);background-size:200% 200%;animation:shift 5s ease infinite;transition:transform .2s,box-shadow .2s}
.buy-btn-lemon{background:linear-gradient(135deg,#f59e0b,#f97316,#ea580c);background-size:200% 200%;animation:shift 5s ease infinite;transition:transform .2s,box-shadow .2s;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.buy-btn:hover{transform:scale(1.04);box-shadow:0 0 22px rgba(124,58,237,.65)}
.buy-btn-lemon:hover{transform:scale(1.04);box-shadow:0 0 22px rgba(249,115,22,.65)}
@keyframes shift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.float{animation:float 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.buy-btn,.buy-btn-lemon,.float{animation:none}.card{transition:none}}
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased transition-colors duration-300 dark:bg-slate-950 dark:text-slate-100">

<!-- Dekoratif parıltılar -->
<div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
  <div class="absolute -left-32 -top-32 h-96 w-96 rounded-full bg-violet-400/30 blur-3xl dark:bg-violet-600/20"></div>
  <div class="absolute -right-32 top-1/3 h-96 w-96 rounded-full bg-sky-300/30 blur-3xl dark:bg-blue-600/20"></div>
  <div class="absolute bottom-0 left-1/3 h-80 w-80 rounded-full bg-amber-300/30 blur-3xl dark:bg-orange-500/10"></div>
</div>

<header class="mx-auto flex max-w-6xl items-center justify-between px-4 pt-5">
  <span class="text-lg font-extrabold tracking-tight">Ilgaz<span class="text-violet-600 dark:text-violet-400"> Digital</span></span>
  <button id="themeBtn" type="button" aria-label="Toggle dark / light theme" class="flex h-11 w-11 items-center justify-center rounded-full border border-slate-200 bg-white text-xl shadow-sm transition hover:scale-110 dark:border-slate-700 dark:bg-slate-800">
    <span id="themeIcon" aria-hidden="true">🌙</span>
  </button>
</header>

<section class="mx-auto max-w-4xl px-4 pb-10 pt-12 text-center">
  <span class="inline-block rounded-full border border-violet-200 bg-violet-50 px-4 py-1 text-xs font-bold uppercase tracking-wider text-violet-700 dark:border-violet-500/30 dark:bg-violet-500/10 dark:text-violet-300">Single-file · No install · Easy to deploy</span>
  <h1 class="mt-5 text-4xl font-extrabold leading-tight tracking-tight sm:text-5xl lg:text-6xl">
    <span class="bg-gradient-to-r from-violet-600 via-indigo-500 to-sky-500 bg-clip-text text-transparent">Ilgaz Digital</span>
    <span class="text-slate-400 dark:text-slate-500"> — </span>Ready-to-Deploy Web Templates &amp; Micro Tools
  </h1>
  <p class="mx-auto mt-5 max-w-2xl text-lg text-slate-500 dark:text-slate-400">Try each tool live, then grab the full source code for just $2.</p>
</section>

<main class="mx-auto max-w-6xl px-4 pb-16">
  <div id="grid" class="grid gap-6 md:grid-cols-3"></div>
</main>

<footer class="border-t border-slate-200 py-8 text-center text-sm text-slate-400 dark:border-slate-800">
  © <span id="yr"></span> Ilgaz Digital. All rights reserved.
</footer>

<script>
const PRODUCTS = [
  {
    icon: '🏦', grad: 'from-teal-500 via-emerald-500 to-cyan-500',
    name: 'Global Loan Calculator',
    sub: '15 Languages & 20 Currencies',
    desc: 'Monthly payment, total repayment and a full amortization schedule, instantly.',
    chips: ['15 Languages', '20 Currencies', 'Payment schedule'],
    demo: 'https://github.io', gum: 'https://gumroad.com', lemon: 'https://lemonsqueezy.com'
  },
  {
    icon: '🛒', grad: 'from-pink-500 via-fuchsia-500 to-violet-500',
    name: 'Fun Animated Shopping List',
    sub: 'iPad Pencil Feel & 15 Languages',
    desc: 'Cross items out with a hand-drawn stroke, a satisfying tick sound and tiny confetti.',
    chips: ['Pencil animation', '15 Languages', 'Saves automatically'],
    demo: 'https://github.io', gum: 'https://gumroad.com', lemon: 'https://lemonsqueezy.com'
  },
  {
    icon: '📈', grad: 'from-indigo-500 via-blue-500 to-sky-500',
    name: 'Smart Wealth & Budget Planner',
    sub: '15 Languages & 20 Currencies',
    desc: 'Split your income with smart rules, then tune every percentage with live sliders.',
    chips: ['15 Languages', '20 Currencies', 'Live progress bars'],
    demo: 'https://github.io', gum: 'https://gumroad.com', lemon: 'https://lemonsqueezy.com'
  }
];

document.getElementById('grid').innerHTML = PRODUCTS.map(p => `
  <article class="card flex flex-col overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-lg shadow-slate-200/60 hover:shadow-2xl dark:border-slate-800 dark:bg-slate-900 dark:shadow-none dark:hover:shadow-violet-900/30">
    <div class="relative flex h-40 items-center justify-center overflow-hidden bg-gradient-to-br ${p.grad}">
      <div aria-hidden="true" class="absolute -right-6 -top-6 h-28 w-28 rounded-full bg-white/20"></div>
      <div aria-hidden="true" class="absolute -bottom-8 -left-4 h-24 w-24 rounded-full bg-white/10"></div>
      <span class="float text-7xl drop-shadow-lg" aria-hidden="true">${p.icon}</span>
    </div>
    <div class="flex flex-1 flex-col p-6">
      <h2 class="text-xl font-extrabold leading-snug">${p.name}</h2>
      <p class="mt-1 text-sm font-semibold text-violet-600 dark:text-violet-400">${p.sub}</p>
      <p class="mt-3 text-sm text-slate-500 dark:text-slate-400">${p.desc}</p>
      <div class="mt-4 flex flex-wrap gap-2">
        ${p.chips.map(c => `<span class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600 dark:bg-slate-800 dark:text-slate-300">${c}</span>`).join('')}
      </div>
      <div class="mt-auto pt-6">
        <a href="${p.demo}" target="_blank" rel="noopener noreferrer" class="flex w-full items-center justify-center gap-2 rounded-2xl border-2 border-slate-900 px-4 py-3 font-bold transition hover:bg-slate-900 hover:text-white dark:border-slate-200 dark:hover:bg-slate-100 dark:hover:text-slate-900">
          <span aria-hidden="true">👀</span> Live Demo
        </a>
        <p class="mb-2 mt-4 text-center text-xs font-bold uppercase tracking-wider text-slate-400">Buy ($2)</p>
        <div class="grid grid-cols-2 gap-2">
          <a href="${p.gum}" target="_blank" rel="noopener noreferrer" class="buy-btn rounded-2xl px-2 py-3 text-center text-sm font-extrabold text-white">🚀 Gumroad</a>
          <a href="${p.lemon}" target="_blank" rel="noopener noreferrer" class="buy-btn-lemon rounded-2xl px-2 py-3 text-center text-sm font-extrabold text-white">🍋 Lemon Squeezy</a>
        </div>
      </div>
    </div>
  </article>`).join('');

// Tema düğmesi
const root = document.documentElement, icon = document.getElementById('themeIcon');
const sync = () => icon.textContent = root.classList.contains('dark') ? '☀️' : '🌙';
document.getElementById('themeBtn').addEventListener('click', () => {
  const dark = root.classList.toggle('dark');
  try { localStorage.setItem('ilgazTheme', dark ? 'dark' : 'light'); } catch (e) {}
  sync();
});
sync();
document.getElementById('yr').textContent = new Date().getFullYear();
</script>
</body>
</html>
